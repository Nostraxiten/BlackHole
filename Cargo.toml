[package]
name = "blackhole"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blackhole"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ipnet = "2"
async-trait = "0.1"
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "gzip", "stream"], default-features = false }
flate2 = "1.0"
colored = "2"
rand = "0.8"
